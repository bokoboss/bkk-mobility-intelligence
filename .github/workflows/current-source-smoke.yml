name: Current Source Smoke

# Bangkok-wide v1 validated for Pages publication (2026-09-27)

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy the validated Now dashboard to GitHub Pages"
        required: false
        type: boolean
        default: false
  push:
    paths:
      - "scripts/live/**"
      - "scripts/spatial/**"
      - "scripts/analysis/**"
      - "scripts/audit/**"
      - "scripts/history/**"
      - "scripts/build/**"
      - "web/**"
      - "config/study_area.json"
      - "data/reference/**"
      - "tests/**"
      - ".github/workflows/current-source-smoke.yml"

permissions:
  contents: read

jobs:
  current-source-smoke:
    if: ${{ !contains(github.event.head_commit.message, '[audit-hydro]') && !contains(github.event.head_commit.message, '[audit-bangkok]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 20
    env:
      LONGDO_MAP_API_KEY: ${{ secrets.LONGDO_MAP_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Frontend map syntax check
        run: |
          node --check web/app.js
          grep -q "maplibre-gl@5" web/index.html
          grep -q "tiles.openfreemap.org/styles/liberty" web/app.js

      - name: Fetch current source bundle
        run: python scripts/live/fetch_current_bundle.py

      - name: Fetch documented Longdo Traffic Index context
        run: python scripts/live/fetch_longdo_traffic_index.py

      - name: Fetch iTIC/Longdo camera metadata
        run: python scripts/live/fetch_itic_cameras.py

      - name: Fetch TMD NWP precipitation context
        id: tmd_context
        run: |
          python scripts/live/fetch_tmd_precip_context.py
          echo "init_time=$(python -c 'import json; print(json.load(open("data/raw/current_context/tmd_precip_context.json")).get("initial_time", "unknown"))')" >> "$GITHUB_OUTPUT"

      - name: Restore TMD Domain-2 precipitation cache
        uses: actions/cache@v4
        with:
          path: data/cache/tmd/
          key: tmd-p24h-d02-${{ steps.tmd_context.outputs.init_time }}

      - name: Build HII station registry
        run: python scripts/live/fetch_hii_rain_station_registry.py

      - name: Analyze Longdo Traffic Index baseline
        run: python scripts/analysis/analyze_longdo_traffic_index.py

      - name: Restore validated OSM geometry cache
        uses: actions/cache@v4
        with:
          path: data/processed/osm/core_roads.geojson
          key: osm-bangkok-citywide-v1-${{ hashFiles('config/study_area.json', 'data/reference/bangkok_districts.geojson') }}

      - name: Restore Bangkok OSM tile cache
        id: osm_tile_cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/osm_bangkok/
          key: osm-bangkok-tiles-${{ hashFiles('config/study_area.json', 'data/reference/bangkok_districts.geojson') }}-${{ github.sha }}
          restore-keys: |
            osm-bangkok-tiles-${{ hashFiles('config/study_area.json', 'data/reference/bangkok_districts.geojson') }}-

      - name: Fetch Bangkok-wide OSM road geometry
        id: fetch_bangkok_osm
        run: python scripts/spatial/fetch_bangkok_network.py

      - name: Save Bangkok OSM tile cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache/osm_bangkok/
          key: osm-bangkok-tiles-${{ hashFiles('config/study_area.json', 'data/reference/bangkok_districts.geojson') }}-${{ github.sha }}

      - name: Match current events to core-road geometry
        shell: bash
        run: |
          manifest=$(python -c 'import json; print(json.load(open("data/raw/current/latest.json"))["manifest"])')
          run_dir=$(dirname "$manifest")
          python scripts/spatial/assign_districts.py \
            --events "$run_dir/events.study_area.json" \
            --output "$run_dir/events.bangkok.json"
          python scripts/spatial/match_events_to_network.py \
            --events "$run_dir/events.bangkok.json" \
            --network data/processed/osm/core_roads.geojson \
            --config config/study_area.json \
            --output "$run_dir/events.network_matched.json"
          python scripts/spatial/cluster_network_events.py \
            --events "$run_dir/events.network_matched.json" \
            --output "$run_dir/incidents.confirmed_clusters.json"

      - name: Build recent 7/30-day incident intelligence
        shell: bash
        run: |
          python scripts/history/fetch_recent_event_history.py
          python scripts/spatial/assign_districts.py \
            --events data/raw/history/recent_30d.study_area.json \
            --output data/processed/history/recent_30d.bangkok.json
          python scripts/spatial/match_events_to_network.py \
            --events data/processed/history/recent_30d.bangkok.json \
            --network data/processed/osm/core_roads.geojson \
            --config config/study_area.json \
            --output data/processed/history/recent_30d.network_matched.json
          python scripts/history/build_recent_incident_intelligence.py \
            --events data/processed/history/recent_30d.network_matched.json

      - name: Sample TMD 3-km precipitation grid
        run: |
          python scripts/live/sample_tmd_precip_grid.py \
            --network data/processed/osm/core_roads.geojson

      - name: Build flood/rain intelligence
        run: python scripts/flood/build_flood_intelligence.py

      - name: Optional Longdo current speed sample
        if: ${{ env.LONGDO_MAP_API_KEY != '' }}
        run: |
          python scripts/live/fetch_longdo_traffic_speed.py \
            --network data/processed/osm/core_roads.geojson \
            --output data/processed/current_speed/longdo_speed.json \
            --max-points 8

      - name: Build frontend-neutral Now snapshot
        run: python scripts/build/build_now_snapshot.py

      - name: Build Now dashboard preview
        run: |
          python scripts/build/build_static_site.py
          test -s dist/index.html
          python -c 'import json; json.load(open("dist/data/latest_status.json", encoding="utf-8")); json.load(open("dist/data/core_roads.geojson", encoding="utf-8")); json.load(open("dist/data/recent_incident_intelligence.json", encoding="utf-8")); json.load(open("dist/data/flood_intelligence.json", encoding="utf-8")); d=json.load(open("dist/data/bangkok_districts.geojson", encoding="utf-8")); assert len(d.get("features", [])) == 50'

      - name: Print latest summary
        if: always()
        shell: bash
        run: |
          if [ -f data/raw/current/latest.json ]; then
            manifest=$(python -c 'import json; print(json.load(open("data/raw/current/latest.json"))["manifest"])')
            python scripts/live/summarize_latest.py "$manifest"
          else
            echo "No latest manifest was produced."
          fi

      - name: Upload Now dashboard preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: now-dashboard-preview
          path: dist/
          if-no-files-found: warn
          retention-days: 3

      - name: Configure GitHub Pages
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-pages]')) }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-pages]')) }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

      - name: Upload current-source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-source-smoke
          path: |
            data/raw/current/
            data/processed/osm/
            data/processed/current_speed/
            data/raw/current_context/
            data/raw/history/
            data/processed/current_context/
            data/processed/history/
            data/processed/flood/
            data/processed/now/
          if-no-files-found: warn
          retention-days: 3

  deploy-pages:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.deploy_pages) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-pages]')) }}
    needs: current-source-smoke
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


  hydro-source-audit:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[audit-hydro]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit BMA and TMD hydro source contracts
        run: python scripts/audit/audit_hydro_sources.py


  bangkok-source-audit:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[audit-bangkok]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Bangkok OSM boundary and 50 districts
        run: python scripts/audit/audit_bangkok_admin.py
