name: Current Source Smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/live/**"
      - "scripts/spatial/**"
      - "scripts/analysis/**"
      - "scripts/build/**"
      - "web/**"
      - "config/study_area.json"
      - "tests/**"
      - ".github/workflows/current-source-smoke.yml"

permissions:
  contents: read

jobs:
  current-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      LONGDO_MAP_API_KEY: ${{ secrets.LONGDO_MAP_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch current source bundle
        run: python scripts/live/fetch_current_bundle.py

      - name: Fetch documented Longdo Traffic Index context
        run: python scripts/live/fetch_longdo_traffic_index.py

      - name: Audit 2026 Longdo Traffic Index history
        run: python scripts/audit/audit_longdo_traffic_index_history.py

      - name: Fetch iTIC/Longdo camera metadata
        run: python scripts/live/fetch_itic_cameras.py

      - name: Analyze Longdo Traffic Index baseline
        run: python scripts/analysis/analyze_longdo_traffic_index.py

      - name: Restore validated OSM geometry cache
        uses: actions/cache@v4
        with:
          path: data/processed/osm/core_roads.geojson
          key: osm-core-roads-v2-${{ hashFiles('config/study_area.json') }}

      - name: Fetch OSM core-road geometry
        run: python scripts/spatial/fetch_osm_network.py

      - name: Match current events to core-road geometry
        shell: bash
        run: |
          manifest=$(python -c 'import json; print(json.load(open("data/raw/current/latest.json"))["manifest"])')
          run_dir=$(dirname "$manifest")
          python scripts/spatial/match_events_to_network.py \
            --events "$run_dir/events.study_area.json" \
            --network data/processed/osm/core_roads.geojson \
            --config config/study_area.json \
            --output "$run_dir/events.network_matched.json"
          python scripts/spatial/cluster_network_events.py \
            --events "$run_dir/events.network_matched.json" \
            --output "$run_dir/incidents.confirmed_clusters.json"

      - name: Optional Longdo current speed sample
        if: ${{ env.LONGDO_MAP_API_KEY != '' }}
        run: |
          python scripts/live/fetch_longdo_traffic_speed.py \
            --network data/processed/osm/core_roads.geojson \
            --output data/processed/current_speed/longdo_speed.json \
            --max-points 8

      - name: Build frontend-neutral Now snapshot
        run: python scripts/build/build_now_snapshot.py

      - name: Build Now dashboard preview
        run: |
          python scripts/build/build_static_site.py
          test -s dist/index.html
          python -c 'import json; json.load(open("dist/data/latest_status.json", encoding="utf-8")); json.load(open("dist/data/core_roads.geojson", encoding="utf-8"))'

      - name: Print latest summary
        if: always()
        shell: bash
        run: |
          if [ -f data/raw/current/latest.json ]; then
            manifest=$(python -c 'import json; print(json.load(open("data/raw/current/latest.json"))["manifest"])')
            python scripts/live/summarize_latest.py "$manifest"
          else
            echo "No latest manifest was produced."
          fi

      - name: Upload Now dashboard preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: now-dashboard-preview
          path: dist/
          if-no-files-found: warn
          retention-days: 3

      - name: Upload current-source artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-source-smoke
          path: |
            data/raw/current/
            data/processed/osm/
            data/processed/current_speed/
            data/raw/current_context/
            data/processed/current_context/
            data/processed/now/
          if-no-files-found: warn
          retention-days: 3
